[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csgs"
version = "0.1.0"
description = "Local-first Codex Session Graph System MVP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
mcp = ["mcp>=1.10"]

[project.scripts]
csgs = "csgs.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
