services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - csgs
    environment:
      CSGS_DOMAIN: ${CSGS_DOMAIN:-csgs.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
